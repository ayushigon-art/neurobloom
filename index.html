<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mindora</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--cloud:#FAFCFF;--sky:#DCEEFF;--blue:#397FC2;--navy:#142D4E;--lav:#E9E3FF;--green:#D8EAD8;--mint:#BFE8D2;--peach:#FFD9C8;--yel:#FFE9A8;--mut:#63758A;--accent:#397FC2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.5 Nunito,system-ui,sans-serif;color:var(--navy);background:linear-gradient(160deg,#FAFCFF,#EEF0FF 70%,#F3EEFF);min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:600}h1{font-size:clamp(28px,4vw,42px);line-height:1.1}h2{font-size:24px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{display:flex;min-height:100vh}
nav{width:230px;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:#ffffffaa;border-right:1px solid #DCE6F2}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:22px;margin:0 8px 20px}
nav button{display:flex;gap:12px;align-items:center;border:0;background:none;padding:11px 14px;border-radius:16px;font-weight:600;color:var(--mut);text-align:left}
nav button.on{background:var(--sky);color:var(--navy)}nav button:hover{background:var(--lav)}
main{flex:1;padding:28px clamp(16px,3vw,40px) 40px;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;color:var(--mut);gap:10px;flex-wrap:wrap}
.pill{border-radius:99px;padding:6px 14px;background:var(--green);color:var(--navy);font-weight:800;font-size:14px}
.card{background:#fff;border:1px solid #E1EAF5;border-radius:26px;padding:22px;box-shadow:0 6px 24px #142D4E0d}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(120deg,var(--sky),var(--lav));border:0;overflow:hidden;flex-wrap:wrap}
.hero p{max-width:440px;color:#34506f}
.btn{border:0;border-radius:99px;padding:11px 22px;background:var(--accent);color:#fff;font-weight:800}.btn.alt{background:#fff;color:var(--navy)}.btn.sm{padding:6px 14px;font-size:14px}
.btn:active{transform:scale(.96)}
.grid{display:grid;gap:18px;margin-top:18px}.rings{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ring{text-align:center;padding:16px}.ring svg{width:100%;max-width:130px}.ring .v{font:800 22px Nunito;fill:var(--navy)}
.ring circle.p{transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{aspect-ratio:1;border:0;border-radius:14px;background:none;font-weight:600;position:relative}
.cal button:hover{background:var(--sky)}.cal .today{box-shadow:inset 0 0 0 2px var(--accent)}.cal .sel{background:var(--accent);color:#fff}
.dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}.dots i{width:6px;height:6px;border-radius:50%}
.ev{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;margin-top:8px}
.ev.done span{text-decoration:line-through;opacity:.6}.ev span{flex:1}
input,select,textarea{border:1px solid #CBD9EA;border-radius:14px;padding:9px 12px;background:#fff;width:100%}textarea{min-height:110px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input,.row select{flex:1;min-width:120px;width:auto}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:380px}
.mem button{aspect-ratio:1;border-radius:18px;border:0;font-size:34px;background:var(--blue);color:#fff;transition:transform .3s}
.mem button.f{background:var(--yel);transform:rotateY(0)}.mem button.m{background:var(--mint)}
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}.timer svg{width:min(320px,80vw)}
.timer .big{font:600 56px Fraunces,serif;fill:var(--navy)}
.chip{border:1px solid #CBD9EA;background:#fff;border-radius:99px;padding:6px 14px}.chip.on{background:var(--navy);color:#fff}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:99px;z-index:9;animation:in .3s}
@keyframes in{from{opacity:0;transform:translate(-50%,10px)}}
.breathe{animation:br 8s ease-in-out infinite}@keyframes br{50%{transform:scale(1.04)}}
.sway{transform-origin:bottom;animation:sw 5s ease-in-out infinite alternate}@keyframes sw{to{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){nav{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:5;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;border-top:1px solid #DCE6F2}.logo{display:none}nav button{flex-direction:column;gap:0;padding:6px 10px;font-size:12px;min-width:62px;align-items:center}#app{display:block}main{padding-bottom:100px}}
</style></head><body>

 84" stroke="#27406F" stroke-width="1.4" fill="none" opacity=".35"/><path d="M100 114C97 152 122 164 134 148" fill="none" stroke="#5E86BB" stroke-width="27"/><path d="M100 114C97 152 122 164 134 148" fill="none" stroke="#27406F" stroke-width="26" stroke-dasharray="1.4 7" opacity=".4"/><path d="M89 112C87 140 100 154 112 156" fill="none" stroke="#B7D0EC" stroke-width="4" opacity=".45"/><g filter="url(#gw)"><path d="M100 50L105 60L100 70L95 60Z" fill="#8FFFE6"/><circle cx="100" cy="79" r="2" fill="#8FFFE6"/><path d="M84 62Q80 70 84 78M116 62Q120 70 116 78" stroke="#8FFFE6" stroke-width="1.6" fill="none"/></g><ellipse cx="78" cy="96" rx="8" ry="9" fill="#121C33"/><ellipse cx="122" cy="96" rx="8" ry="9" fill="#121C33"/><circle cx="78" cy="96" r="5" fill="#E8A93E" filter="url(#gw)"/><circle cx="122" cy="96" r="5" fill="#E8A93E" filter="url(#gw)"/><circle cx="78" cy="96" r="2.6" fill="#0B1224"/><circle cx="122" cy="96" r="2.6" fill="#0B1224"/><circle cx="80.5" cy="93" r="2" fill="#fff"/><circle cx="124.5" cy="93" r="2" fill="#fff"/><path d="M66 86Q78 79 90 85M110 85Q122 79 134 86" stroke="#27406F" stroke-width="2" fill="none" opacity=".6"/></g><g filter="url(#gw)" fill="#CFFFF4"><circle cx="22" cy="40" r="2.2"/><circle cx="176" cy="34" r="2.6"/><circle cx="186" cy="150" r="2"/><circle cx="14" cy="150" r="2.4"/><circle cx="150" cy="14" r="1.8"/></g></symbol><symbol id="mochiV2" viewBox="0 0 200 200"><g stroke="#2F5F96" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="100" cy="156" rx="50" ry="36" fill="url(#mb)"/><rect x="62" y="168" width="26" height="22" rx="12" fill="#5C99D6"/><rect x="112" y="168" width="26" height="22" rx="12" fill="#5C99D6"/><path d="M56 70C14 40 2 112 38 136C60 142 64 104 62 86Z" fill="url(#me)"/><path d="M52 80C30 66 22 108 40 122C52 124 56 100 54 88Z" fill="#FFB3C4" stroke="none"/><path d="M144 70C186 40 198 112 162 136C140 142 136 104 138 86Z" fill="url(#me)"/><path d="M148 80C170 66 178 108 160 122C148 124 144 100 146 88Z" fill="#FFB3C4" stroke="none"/><circle cx="100" cy="94" r="56" fill="url(#mb)"/><path d="M64 66C84 40 118 42 136 64C116 56 86 54 64 66Z" fill="#fff" opacity=".3" stroke="none"/><path d="M100 118C98 150 122 160 134 146" fill="none" stroke="#6AA3DD" stroke-width="26"/><path d="M100 118C98 150 122 160 134 146" fill="none" stroke="#2F5F96" stroke-width="1.5" stroke-dasharray="2 7" opacity=".6"/><ellipse cx="78" cy="94" rx="9" ry="11" fill="#1B3555" stroke="none"/><ellipse cx="122" cy="94" rx="9" ry="11" fill="#1B3555" stroke="none"/><circle cx="81" cy="90" r="3.5" fill="#fff" stroke="none"/><circle cx="125" cy="90" r="3.5" fill="#fff" stroke="none"/><circle cx="75" cy="98" r="1.6" fill="#fff" stroke="none"/><circle cx="119" cy="98" r="1.6" fill="#fff" stroke="none"/><ellipse cx="62" cy="114" rx="9" ry="6" fill="#FF9DB4" stroke="none" opacity=".7"/><ellipse cx="138" cy="114" rx="9" ry="6" fill="#FF9DB4" stroke="none" opacity=".7"/><path d="M82 116Q91 124 99 117" fill="none" stroke="#1B3555" stroke-width="2.5"/><g stroke="none"><circle cx="118" cy="44" r="6" fill="#FFD36B"/><circle cx="118" cy="34" r="5" fill="#FFB3C4"/><circle cx="128" cy="44" r="5" fill="#FFB3C4"/><circle cx="118" cy="54" r="5" fill="#FFB3C4"/><circle cx="108" cy="44" r="5" fill="#FFB3C4"/><circle cx="118" cy="44" r="4" fill="#FFD36B"/></g></g></symbol><symbol id="mochiOld" viewBox="0 0 200 200"><g stroke="#142D4E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

<script>
const $=s=>document.querySelector(s),CATS={Focus:'#BFD8F5',Learning:'#E9E3FF',Sleep:'#FFE9A8',Wellbeing:'#BFE8D2',Personal:'#FFD9C8',Other:'#D8EAD8'};
const KEY='neurobloom1',def={name:'Friend',goal:60,accent:'#397FC2',foc:0,sleep:0,learn:0,well:0,day:'',pts:0,items:[],events:[],journal:[],favs:[],log:{},recurNote:0};
let S;try{S={...def,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){S={...def}}
const iso=d=>d.toISOString?new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10):d;
let today=iso(new Date());if(S.day!==today){S.day=today;S.foc=S.sleep=S.learn=S.well=0}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};document.documentElement.style.setProperty('--accent',S.accent);
let view='home',sel=today,cm=new Date(),T={dur:25,left:25*60,end:0,run:false,iv:0},mem=null,toastT;
const NAV=[['home','Home','⌂'],['cal','Calendar','▦'],['garden','Garden','❀'],['gym','Brain Gym','◈'],['focus','Focus','◔'],['journal','Journal','✎'],['set','Settings','⚙']];
function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}
const REW={foc:['leaf','Focus earned a new leaf'],learn:['flower','Learning grew a flower'],sleep:['fern','Sleep routine planted a fern'],well:['lantern','Wellbeing added a garden lantern']};
function add(k,n,msg){S[k]+=n;S.pts+=1;const r=REW[k];S.items.push({t:r[0],at:today});S.log[today]=(S.log[today]||0)+1;save();toast(msg||r[1]+' 🌱');render()}
function ring(c,v,m,l,u,act){const p=Math.min(1,v/m),C=276.5;return `<div class="card ring"><svg viewBox="0 0 110 110" role="img" aria-label="${l}: ${v} of ${m} ${u}"><circle cx="55" cy="55" r="44" fill="none" stroke="${c}55" stroke-width="10"/><circle class="p" cx="55" cy="55" r="44" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 55 55)"/><text class="v" x="55" y="62" text-anchor="middle">${v}</text></svg><div><b>${l}</b><div style="color:var(--mut);font-size:14px">of ${m} ${u}</div>${act?`<button class="btn sm" style="margin-top:8px" data-a="${act}">${act==='learn'?'+ Learning activity':act==='sleep'?'+ Hours slept':act==='well'?'+ Wellbeing activity':'+ 5 min'}</button>`:''}</div></div>`}
const hi=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
const MSG=['Little by little, a little becomes a lot.','Rest is part of growing, too.','Curiosity counts as progress.','Small steps still reach the sun.','You don’t have to bloom every day to belong here.','Be patient with the part of you that’s still learning.'];
let daily=()=>MSG[new Date().getDate()%MSG.length];
function plant(it,i){const x=30+(i*47)%340,y=170+(i*23)%40,c={leaf:'#6DBF8B',flower:'#FF9FB5',fern:'#4FA676',lantern:'#FFD36B'}[it.t];
 return it.t==='flower'?`<g class="sway" style="animation-delay:${i%5}s"><line x1="${x}" y1="${y}" x2="${x}" y2="${y-26}" stroke="#4FA676" stroke-width="3"/><circle cx="${x}" cy="${y-30}" r="9" fill="${c}"/><circle cx="${x}" cy="${y-30}" r="4" fill="#FFE9A8"/></g>`:it.t==='lantern'?`<rect x="${x-5}" y="${y-18}" width="10" height="14" rx="4" fill="${c}"/><line x1="${x}" y1="${y-4}" x2="${x}" y2="${y+4}" stroke="#142D4E" stroke-width="2"/>`:`<path class="sway" d="M${x} ${y}q-12 -14 0 -28q12 14 0 28" fill="${c}"/>`}
function garden(sm){const st=Math.min(4,Math.floor(S.pts/4)),h=30+st*28;
 return `<svg viewBox="0 0 400 240" role="img" aria-label="Your garden, growth stage ${st+1} of 5, ${S.items.length} items" style="width:100%;border-radius:22px;background:linear-gradient(#DCEEFF,#F3EEFF 60%)"><circle cx="330" cy="40" r="20" fill="#FFE9A8"/><path d="M0 190Q100 165 200 185T400 175V240H0Z" fill="#D8EAD8"/><path d="M0 210Q120 190 240 208T400 200V240H0Z" fill="#BFE8D2"/>
 <g class="sway"><rect x="196" y="${195-h}" width="8" height="${h}" rx="4" fill="#8B6B4A"/>${[...Array(st+1)].map((_,i)=>`<circle cx="${200+(i%2?18:-18)}" cy="${195-h+i*14}" r="${14+i*3}" fill="${i%2?'#6DBF8B':'#4FA676'}"/>`).join('')}${st>=3?'<circle cx="214" cy="'+(195-h)+'" r="6" fill="#FF9FB5"/>':''}</g>
 ${S.items.slice(-24).map(plant).join('')}<use href="#mochi" x="250" y="120" width="${sm?70:80}" height="${sm?70:80}"/></svg>`}
const V={
home(){const gp=Math.round(100*Math.min(1,(S.foc/S.goal+S.sleep/8+S.learn/3+S.well/3)/4));
 return `<section class="card hero"><div><h1>${hi()}, ${esc(S.name)}.</h1><p>${daily()} Your mind deserves care, curiosity, and room to grow.</p><div class="row" style="margin-top:14px"><button class="btn" data-go="focus">Start a focus session</button><button class="btn alt" data-go="garden">Visit my garden</button></div></div><svg class="breathe" width="190" height="190"><use href="#mochi"/></svg></section>
 <div class="grid rings">${ring('#397FC2',S.foc,S.goal,'Focus','min','foc')}${ring('#E0B54A',S.sleep,8,'Sleep routine','hrs, self-reported','sleep')}${ring('#9A86E0',S.learn,3,'Learning','activities','learn')}${ring('#4FA676',S.well,3,'Wellbeing','activities','well')}${ring('#F08F6A',gp,100,'Daily growth','%','')}</div>
 <div class="grid two"><div class="card"><h3>Today’s garden</h3>${garden(1)}</div><div class="card"><h3>Picked for your day</h3><p>Try one of these, then log it on a ring:</p><ul><li>A 25-minute focus session</li><li>One thing you’re curious about</li><li>Two minutes of slow breathing</li></ul><button class="btn alt" data-go="gym">Open Brain Gym</button></div></div>`},
cal(){const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),ev=S.events.filter(e=>e.d===sel);
 let g=['S','M','T','W','T','F','S'].map(d=>`<b style="color:var(--mut)">${d}</b>`).join('')+'<span></span>'.repeat(f);
 for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),es=S.events.filter(e=>e.d===k);g+=`<button data-d="${k}" class="${k===today?'today ':''}${k===sel?'sel':''}" aria-label="${k}, ${es.length} events">${d}<span class="dots">${es.slice(0,3).map(e=>`<i style="background:${e.done?'#4FA676':CATS[e.c]}"></i>`).join('')}</span></button>`}
 return `<h1>My Calendar</h1><div class="grid two"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn sm alt" data-m="-1" aria-label="Previous month">‹</button><h2>${cm.toLocaleString('en',{month:'long',year:'numeric'})}</h2><button class="btn sm alt" data-m="1" aria-label="Next month">›</button></div><div class="cal">${g}</div></div>
 <div class="card"><h2>${sel}</h2>${ev.length?ev.map(e=>`<div class="ev ${e.done?'done':''}" style="background:${CATS[e.c]}"><input type="checkbox" style="width:20px" ${e.done?'checked':''} data-t="${e.id}" aria-label="Mark done"><span>${esc(e.t)} · ${e.c}</span><button class="btn sm alt" data-x="${e.id}" aria-label="Delete">✕</button></div>`).join(''):'<p style="color:var(--mut)">Nothing planned. A quiet day is a fine plan, or add something small.</p>'}
 <div class="row" style="margin-top:14px"><input id="et" placeholder="Add a task" aria-label="Event title"><select id="ec" aria-label="Category">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select><button class="btn" data-a="addev">Add</button></div></div></div>`},
garden(){const c={};S.items.forEach(i=>c[i.t]=(c[i.t]||0)+1);const st=Math.min(5,Math.floor(S.pts/4)+1);
 return `<h1>Brain Garden</h1><div class="card" style="margin-top:14px">${garden()}<p><span class="pill">Growth stage ${st} of 5</span> Everything you earn stays. Breaks never shrink your garden.</p></div><div class="grid rings">${Object.entries(REW).map(([k,[t,m]])=>`<div class="card ring"><h2>${c[t]||0}</h2><b>${t}s</b><div style="color:var(--mut);font-size:14px">${k==='foc'?'Focus sessions':k==='learn'?'Learning':k==='sleep'?'Sleep routine':'Wellbeing'}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:18px"><h3>Milestones</h3>${[[1,'First sprout'],[5,'Five good moments'],[12,'Steady gardener'],[25,'Full bloom']].map(([n,l])=>`<span class="pill" style="margin:4px;display:inline-block;background:${S.pts>=n?'var(--mint)':'#EEF2F7'};color:${S.pts>=n?'var(--navy)':'var(--mut)'}">${S.pts>=n?'✓':'○'} ${l}</span>`).join('')}</div>`},
gym(){if(!mem)newMem();const won=mem.cards.every(c=>c.m);
 return `<h1>Brain Gym</h1><p style="color:var(--mut)">Just for fun. These games don’t measure intelligence or treat anything.</p><div class="card"><h2>Memory Match</h2><p>Moves: <b>${mem.moves}</b> · Time: <b id="mt">${mem.t}s</b></p><div class="mem">${mem.cards.map((c,i)=>`<button data-c="${i}" class="${c.f||c.m?'f ':''}${c.m?'m':''}" aria-label="${c.f||c.m?'card '+c.s:'hidden card'}" style="${c.f||c.m?'color:'+c.k:''}">${c.f||c.m?c.s:''}</button>`).join('')}</div>${won?`<p class="pill" style="display:inline-block;margin-top:12px">All matched in ${mem.moves} moves. Lovely!</p>`:''}<div style="margin-top:12px"><button class="btn" data-a="newmem">Restart</button></div></div><p style="color:var(--mut)">More games (Pattern Recall, Word Garden) are on the roadmap.</p>`},
focus(){const C=2*Math.PI*130,p=T.left/(T.dur*60);const mm=String(Math.floor(T.left/60)).padStart(2,'0'),ss=String(T.left%60).padStart(2,'0');
 return `<h1>Focus Studio</h1><div class="card timer"><div class="row">${[15,25,45,5].map(d=>`<button class="chip ${T.dur===d?'on':''}" data-dur="${d}">${d===5?'Break 5':d} min</button>`).join('')}</div><svg viewBox="0 0 300 300" role="timer" aria-label="${mm}:${ss} remaining"><circle cx="150" cy="150" r="130" fill="none" stroke="#DCEEFF" stroke-width="16"/><circle id="tr" cx="150" cy="150" r="130" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 150 150)"/><text id="tt" class="big" x="150" y="168" text-anchor="middle">${mm}:${ss}</text></svg>
 <div class="row"><button class="btn" data-a="tgl">${T.run?'Pause':T.left<T.dur*60?'Resume':'Start'}</button><button class="btn alt" data-a="rst">Reset</button></div><p style="color:var(--mut)">Today: ${S.foc} of ${S.goal} focused minutes. Sounds are off.</p></div>`},
journal(){const q=S.favs.includes(daily());
 return `<h1>Journal</h1><div class="grid two"><div class="card" style="background:var(--yel)"><h3>Today’s thought</h3><p style="font:600 22px Fraunces,serif">“${daily()}”</p><p>— Mindora (original)</p><button class="btn sm alt" data-a="fav">${q?'★ Saved':'☆ Save'}</button>${S.favs.length?`<p style="font-size:14px">Saved: ${S.favs.map(esc).join(' · ')}</p>`:''}</div>
 <div class="card"><h3>What is one small thing you’re proud of?</h3><select id="jm" aria-label="Mood tag"><option value="">Mood (optional)</option>${['Happy','Calm','Tired','Stressed','Unsure'].map(m=>`<option>${m}</option>`).join('')}</select><textarea id="jt" placeholder="Write freely. This stays on your device." style="margin:8px 0"></textarea><button class="btn" data-a="savej">Save entry</button></div></div>
 <div class="card" style="margin-top:18px"><input id="js" placeholder="Search entries" aria-label="Search"><div id="jl">${jl('')}</div></div>`},
set(){return `<h1>Settings</h1><div class="card" style="max-width:480px"><label>Display name<input id="sn" value="${esc(S.name)}"></label><label><br>Daily focus goal (minutes)<input id="sg" type="number" min="5" max="480" value="${S.goal}"></label><label><br>Accent color<input id="sa" type="color" value="${S.accent}" style="height:44px"></label><div class="row" style="margin-top:16px"><button class="btn" data-a="sets">Save changes</button><button class="btn alt" data-a="clr">Clear all data</button></div></div>`}};
function jl(q){const l=S.journal.filter(j=>(j.t+j.m).toLowerCase().includes(q.toLowerCase()));return l.length?l.map(j=>`<div class="ev" style="background:var(--lav)"><span><small>${j.d}${j.m?' · '+j.m:''}</small><br>${esc(j.t)}</span><button class="btn sm alt" data-jx="${j.id}" aria-label="Delete entry">✕</button></div>`).join(''):'<p style="color:var(--mut)">No entries yet. Your first one can be a single sentence.</p>'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function newMem(){const sy=[['✿','#E0577A'],['●','#397FC2'],['▲','#4FA676'],['★','#E0B54A'],['♥','#9A86E0'],['◆','#F08F6A']];const a=[...sy,...sy].map(([s,k],i)=>({s,k,f:0,m:0,r:Math.random()})).sort((x,y)=>x.r-y.r);mem={cards:a,moves:0,t:0,open:[],t0:0,iv:0};clearInterval(mem.iv)}
function render(){$('#nav').innerHTML='<div class="logo"><svg width="40" height="40"><use href="#mochi"/></svg>Mindora</div>'+NAV.map(([k,l,i])=>`<button data-go="${k}" class="${view===k?'on':''}" ${view===k?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${l}</button>`).join('');
 $('#main').innerHTML=`<div class="top"><span>${new Date().toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}</span><span class="pill">🌱 Garden stage ${Math.min(5,Math.floor(S.pts/4)+1)}</span></div>`+V[view]()}
function tick(){const n=Math.max(0,Math.round((T.end-Date.now())/1000));T.left=n;const C=2*Math.PI*130;$('#tt')&&($('#tt').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'),$('#tr').setAttribute('stroke-dashoffset',C*(1-n/(T.dur*60))));if(n<=0){clearInterval(T.iv);T.run=false;T.left=T.dur*60;if(T.dur>5){add('foc',T.dur,`Session complete: ${T.dur} minutes. Nicely done.`)}else{toast('Break over');render()}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-a],[data-d],[data-m],[data-t],[data-x],[data-dur],[data-c],[data-jx]');if(!b)return;const D=b.dataset;
 if(D.go){view=D.go;render()}
 else if(D.d){sel=D.d;render()}else if(D.m){cm=new Date(cm.getFullYear(),cm.getMonth()+ +D.m,1);render()}
 else if(D.t){const x=S.events.find(v=>v.id==D.t);x.done=!x.done;save();if(x.done){add({Focus:'foc',Learning:'learn',Sleep:'sleep',Wellbeing:'well'}[x.c]||'well',0,'Marked done. Your garden noticed. 🌸')}else render()}
 else if(D.x){S.events=S.events.filter(v=>v.id!=D.x);save();render()}
 else if(D.dur){T.dur=+D.dur;T.left=T.dur*60;T.run=false;clearInterval(T.iv);render()}
 else if(D.c!==undefined){const c=mem.cards[D.c];if(c.f||c.m||mem.open.length>1)return;c.f=1;mem.open.push(c);if(!mem.iv)mem.iv=setInterval(()=>{mem.t++;$('#mt')&&($('#mt').textContent=mem.t+'s')},1000);
  if(mem.open.length===2){mem.moves++;const[a,z]=mem.open;if(a.s===z.s){a.m=z.m=1;a.f=z.f=0;mem.open=[];if(mem.cards.every(c=>c.m)){clearInterval(mem.iv);add('learn',1,'Memory Match complete! A flower grew.');return}}else setTimeout(()=>{a.f=z.f=0;mem.open=[];render()},800)}render()}
 else if(D.jx){S.journal=S.journal.filter(j=>j.id!=D.jx);save();$('#jl').innerHTML=jl($('#js').value)}
 else switch(D.a){
  case'foc':add('foc',5);break;case'learn':add('learn',1);break;case'well':add('well',1);break;case'sleep':add('sleep',1,'Sleep routine logged. Sleep well tonight.');break;
  case'addev':{const t=$('#et').value.trim();if(!t){toast('Type a task name first');$('#et').focus();return}S.events.push({id:Date.now(),d:sel,t,c:$('#ec').value,done:0});save();toast('Added');render();break}
  case'newmem':newMem();render();break;
  case'tgl':if(T.run){clearInterval(T.iv);T.run=false;tick()}else{T.end=Date.now()+T.left*1000;T.run=true;T.iv=setInterval(tick,500)}render();break;
  case'rst':clearInterval(T.iv);T.run=false;T.left=T.dur*60;render();break;
  case'fav':{const q=daily();S.favs=S.favs.includes(q)?S.favs.filter(x=>x!==q):[...S.favs,q];save();render();break}
  case'savej':{const t=$('#jt').value.trim();if(!t){toast('Write a sentence first');return}S.journal.unshift({id:Date.now(),t,m:$('#jm').value,d:new Date().toLocaleString()});save();toast('Entry saved privately');render();break}
  case'sets':S.name=$('#sn').value.trim()||'Friend';S.goal=Math.max(5,+$('#sg').value||60);S.accent=$('#sa').value;document.documentElement.style.setProperty('--accent',S.accent);save();toast('Saved');render();break;
  case'clr':if(confirm('Delete all Mindora data on this device? This can’t be undone.')){try{localStorage.removeItem(KEY)}catch(e){}S={...def,day:today};render();toast('Data cleared')}break}});
document.addEventListener('input',e=>{if(e.target.id==='js')$('#jl').innerHTML=jl(e.target.value)});
document.addEventListener('visibilitychange',()=>{if(T.run)tick()});
render();
</script>
<script>
(()=>{
const st=document.createElement('style');st.textContent=`body{background:radial-gradient(900px 500px at 95% -5%,#E9E3FF,transparent),radial-gradient(700px 500px at -5% 40%,#DCEEFF,transparent),#FAFCFF}.card{transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px #142D4E1c}.hero{background:radial-gradient(circle at 85% 20%,#FFE9A8 0,transparent 30%),linear-gradient(120deg,#DCEEFF,#E9E3FF 60%,#FFD9C8);padding:30px}nav{background:linear-gradient(#fff,#F4F7FF)}nav button.on{background:var(--navy);color:#fff}h1{letter-spacing:-.02em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tile{aspect-ratio:1;border:0;border-radius:22px;opacity:.55;transition:.2s}.tile.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 22px currentColor}.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:260px}dialog{border:0;border-radius:26px;padding:24px;box-shadow:0 20px 60px #142D4E55;width:min(360px,92vw)}dialog::backdrop{background:#142D4E66}.bar{height:10px;border-radius:9px;background:#E7EEF8;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}`;document.head.append(st);
S.lvl=S.lvl||'Medium';S.play=S.play||{};S.sl=S.sl||{};
const C={quotes:[],packs:[],foods:[]};let DB=null,G={g:'memory'},pat=null,wd=null,mt=null;
const DF=[['Overnight oats with berries','steady','veg','Slow-release carbs that many people like before a study block'],['Banana and nut butter','steady','veg','A simple, steady snack','nuts'],['Veggie omelette','protein','veg','Protein-rich start to the day'],['Lentil soup with toast','protein','vegan','Warm, filling and easy to prep'],['Hummus and veggie sticks','steady','vegan','Crunchy desk snack'],['Greek yogurt and fruit','protein','veg','Light but satisfying'],['Water with lemon or mint','hydrate','vegan','Easy to keep next to you while you focus'],['Fruit and seed mix','steady','vegan','Small, portable energy'],['Warm milk or herbal tea','calm','veg','A wind-down ritual before sleep'],['Light rice bowl with veggies','light','vegan','Gentle on an evening'],['Cucumber and melon bowl','hydrate','vegan','Refreshing and hydrating'],['Oat cookies, home-baked','calm','veg','A little treat counts too']].map(([n,t,d,w,x])=>({n,t,d,w,x}));
daily=()=>{const q=C.quotes;return q.length?q[new Date().getDate()%q.length].text:MSG[new Date().getDate()%MSG.length]};
const rec=(g,w)=>{const p=S.play[g]=S.play[g]||{p:0,w:0};p.p++;if(w)p.w++;save()};
const rate=g=>{const p=S.play[g];return p&&p.p?p.w/p.p:null};
const LV=['Easy','Medium','Hard'],gi=()=>LV.indexOf(S.lvl);
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function newMem(){const sy=[['✿','#E0577A'],['●','#397FC2'],['▲','#4FA676'],['★','#E0B54A'],['♥','#9A86E0'],['◆','#F08F6A'],['☾','#6C7FD8'],['❖','#2FA6A0']].slice(0,[4,6,8][gi()]);mem={cards:shuf([...sy,...sy].map(([s,k])=>({s,k,f:0,m:0}))),moves:0,t:0,open:[],iv:0}}
mem=null;window.newMem=newMem;const oldGym=V.gym,oldClick=0;
const TILES=['#F08F6A','#4FA676','#397FC2','#E0B54A'];
function gameHtml(){if(G.g==='memory')return oldGym().replace(/<h1>.*?<\/p>/,'').replace(/<p style="color:var\(--mut\)">More.*$/,'');
 if(G.g==='pattern'){return `<div class="card"><h2>Pattern Recall</h2><p>${pat?pat.msg:'Watch the tiles, then repeat the order.'} (${S.lvl}: ${[3,5,7][gi()]} steps)</p><div class="pg">${TILES.map((c,i)=>`<button class="tile" id="t${i}" data-k="${i}" style="background:${c};color:${c}" aria-label="Tile ${i+1}"></button>`).join('')}</div><p><button class="btn" data-g2="pstart">${pat?'Replay new pattern':'Start'}</button></p></div>`}
 if(G.g==='word'){if(!wd)nextWord();return `<div class="card"><h2>Word Garden</h2><p>Unscramble: <b style="font-size:28px;letter-spacing:.2em">${wd.s}</b></p>${wd.h?`<p>Hint: starts with “${wd.w[0]}”, ${wd.w.length} letters</p>`:''}<div class="row"><input id="wi" placeholder="Your word" aria-label="Answer" autocomplete="off"><button class="btn" data-g2="wcheck">Check</button><button class="btn alt" data-g2="whint">Hint</button></div><p id="wm" style="color:var(--mut)">${wd.m||''}</p></div>`}
 if(!mt)nextMath();return `<div class="card"><h2>Quick Math</h2><p>Question ${Math.min(mt.i+1,5)} of 5 · ${mt.ok} correct</p>${mt.i<5?`<p style="font:600 40px Fraunces,serif">${mt.q[mt.i].t} = ?</p><div class="row"><input id="mi" type="number" aria-label="Answer"><button class="btn" data-g2="mcheck">Check</button></div>`:`<p class="pill" style="display:inline-block">Finished: ${mt.ok}/5</p> <button class="btn" data-g2="mnew">Play again</button>`}</div>`}
function words(){const b=[['plant','cloud','river','smile','sunny'],['garden','planet','pencil','bridge','puzzle'],['butterfly','telescope','curiosity','adventure','chlorophyll']][gi()];const x=C.packs.filter(p=>p.game==='word'&&p.level===S.lvl).flatMap(p=>p.items||[]);return [...b,...x]}
function nextWord(){const w=shuf(words())[0];let s=w;for(let i=0;i<9&&s===w;i++)s=shuf(w.split('')).join('');wd={w,s,h:0,m:''}}
function nextMath(){const m=gi(),r=n=>1+Math.floor(Math.random()*n);mt={i:0,ok:0,q:[...Array(5)].map(()=>{let a,b,o;if(m===0){a=r(15);b=r(15);o=Math.random()<.5?'+':'−'}else if(m===1){a=r(60)+10;b=r(40);o=['+','−','×'][r(3)-1];if(o==='×'){a=r(10);b=r(10)}}else{o=['+','−','×'][r(3)-1];a=o==='×'?r(12)+3:r(400)+100;b=o==='×'?r(12)+3:r(300)+20}if(o==='−'&&b>a)[a,b]=[b,a];return{t:`${a} ${o} ${b}`,a:o==='+'?a+b:o==='×'?a*b:a-b}})}}
function profile(){const G4=[['memory','Memory Match'],['pattern','Pattern Recall'],['word','Word Garden'],['math','Quick Math']];let best=G4.slice().sort((a,b)=>((S.play[a[0]]||{p:0}).p)-((S.play[b[0]]||{p:0}).p))[0][1];const rs=G4.map(([k,n])=>rate(k)).filter(x=>x!==null),avg=rs.length?rs.reduce((a,b)=>a+b)/rs.length:null;const tip=avg===null?'Play a few rounds and your Play Profile will appear.':avg>.8?'You’re winning a lot. Try the next level up.':avg<.4?'Try an easier level for a while. Rounds should feel fun.':'Your level feels about right.';
 return `<div class="card" style="margin-top:18px"><h3>Your Play Profile</h3><p style="color:var(--mut);font-size:14px">Based only on games you’ve played here. It is for fun and for picking games. It isn’t a measure of brain health or intelligence.</p>${G4.map(([k,n])=>{const p=S.play[k]||{p:0,w:0};return `<p style="margin:8px 0 2px">${n} · ${p.p} played, ${p.w} won</p><div class="bar"><i style="width:${p.p?Math.round(100*p.w/p.p):0}%"></i></div>`}).join('')}<p><b>Suggested next:</b> ${best}. ${tip}</p></div>`}
V.gym=()=>`<h1>Brain Gym</h1><div class="tabs" role="tablist">${[['memory','Memory Match'],['pattern','Pattern Recall'],['word','Word Garden'],['math','Quick Math']].map(([k,n])=>`<button class="chip ${G.g===k?'on':''}" data-g="${k}">${n}</button>`).join('')}</div><div class="tabs">Level: ${LV.map(l=>`<button class="chip ${S.lvl===l?'on':''}" data-lv="${l}">${l}</button>`).join('')}</div>${gameHtml()}${profile()}<p style="color:var(--mut)">${C.packs.length?C.packs.length+' extra puzzle pack(s) loaded from the library.':''}</p>`;
V.food=()=>{const d=S.diet||'Any',e=S.energy||'Steady',sl=(S.sl[today]||{}).h,h=new Date().getHours();const want=e==='Low'||(sl&&sl<6)?['steady','protein','hydrate']:h>=19?['light','calm']:S.goal>=60?['steady','hydrate','protein']:['steady','light'];const all=[...DF,...C.foods.map(f=>({n:f.name,t:f.tag,d:f.diet||'veg',w:f.why||'',x:f.nuts}))];const ok=all.filter(f=>(d==='Any'||(d==='Vegan'?f.d==='vegan':f.d==='vegan'||f.d==='veg'))&&!(d==='Nut-free'&&f.x)).filter(f=>want.includes(f.t));
